<style>
:root{--paper:#f1f4ee;--ink:#13201a;--muted:#5d6b63;--line:#d3dacf;--cobalt:#2a4bd7;--saffron:#f0b429;--white:#fff;--danger:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5;font-size:16px}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px 80px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px;gap:12px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.who{font-size:14px;color:var(--muted);display:flex;gap:12px;align-items:center}
.link{background:none;border:0;padding:0;font:inherit;color:var(--cobalt);cursor:pointer;text-decoration:underline}
h1{font-size:clamp(34px,7vw,56px);line-height:1.02;letter-spacing:-.035em;margin:0 0 12px;font-weight:800}
.lead{color:var(--muted);margin:0 0 32px;max-width:46ch}
.login{display:grid;gap:16px;max-width:420px}
label{font-weight:600;font-size:14px;display:grid;gap:6px}
input[type=text],input[type=search],input[type=password],textarea{font:inherit;padding:12px 14px;border:1.5px solid var(--ink);background:var(--white);border-radius:6px;width:100%;color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--danger);font-size:14px;margin:0}
.search{margin-bottom:36px}.search input{font-size:18px;padding:16px 18px}
.cat{margin-bottom:32px}.cat h2{font-size:15px;font-weight:700;margin:0 0 4px;color:var(--cobalt)}
.rows{border-top:1.5px solid var(--ink)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:16px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.row:hover{background:var(--white)}
.row b{font-size:18px;letter-spacing:-.01em}.row span{color:var(--muted);font-size:15px;grid-column:1}
.row .go{grid-column:2;grid-row:1/span 2;align-self:center;font-weight:700;color:var(--cobalt)}
.chip{display:inline-block;font-size:12px;background:var(--saffron);color:var(--ink);padding:2px 8px;border-radius:99px;margin-top:6px;font-weight:600;font-style:normal}
.empty{color:var(--muted);padding:24px 0}
.chat{display:grid;gap:14px;margin-bottom:20px}
.msg{padding:12px 14px;border-radius:6px;white-space:pre-wrap;word-break:break-word;max-width:92%}
.msg.user{background:var(--ink);color:var(--white);justify-self:end}
.msg.assistant{background:var(--white);border:1px solid var(--line)}
.composer{display:grid;gap:10px;position:sticky;bottom:0;background:var(--paper);padding:12px 0}
.btn{font:inherit;font-weight:700;padding:12px 20px;background:var(--cobalt);color:var(--white);border:0;border-radius:6px;cursor:pointer;justify-self:start}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.alt{background:var(--ink)}
.usage{margin:16px 0 28px}.usage small{color:var(--muted);display:block;margin-bottom:6px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--saffron);transition:width .4s}.bar i.full{background:var(--danger)}
.keybox{border:1.5px solid var(--ink);padding:16px;border-radius:6px;background:var(--white);display:grid;gap:10px;margin-bottom:24px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

  {"id": "kod", "name": "Kod yordamchi", "category": "Dasturlash", "description": "Kod yozadi, xatolarni topadi va tushuntiradi.", "prompt": "Sen tajribali dasturchisan. Kodni aniq va ishlaydigan qilib yoz, qisqa tushuntirish qo'sh. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber.", "model": "openai/gpt-oss-120b", "permissions": []},
  {"id": "web", "name": "Veb dasturchi", "category": "Dasturlash", "description": "HTML, CSS va JavaScript bilan sayt va sahifalar yozadi.", "prompt": "Sen veb dasturchisan. Toza, mobilga moslashgan HTML, CSS va JavaScript kod yoz. Kodni to'liq ber va qanday ishga tushirishni qisqa tushuntir. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber.", "model": "openai/gpt-oss-120b", "permissions": []},

  {"id": "sql", "name": "SQL va baza", "category": "Dasturlash", "description": "SQL so'rovlar va baza tuzilmasini tayyorlaydi.", "prompt": "Sen ma'lumotlar bazasi mutaxassisisan. SQL so'rovlarni yoz, jadval tuzilmasini loyihala va natijani tushuntir. Qaysi baza (MySQL, PostgreSQL, SQLite) ekanini so'ra. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber.", "model": "openai/gpt-oss-120b", "permissions": []},
  {"id": "bot", "name": "Telegram bot dasturchisi", "category": "Dasturlash", "description": "Telegram bot kodini yozadi va tushuntiradi.", "prompt": "Sen Telegram bot dasturchisisan. Python (aiogram) yoki JavaScript (grammY) da ishlaydigan bot kodini yoz. Token va kalitlarni kodga yozmaslik, muhit o'zgaruvchisidan olish kerakligini eslat. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber.", "model": "openai/gpt-oss-120b", "permissions": []},
  {"id": "tarjimon", "name": "Tarjimon", "category": "Til", "description": "O'zbek, ingliz, rus va nemis tillari orasida tarjima qiladi.", "prompt": "Sen professional tarjimonsan. Faqat tarjimani ber, ortiqcha izoh yozma. Til aytilmasa, o'zbekchadan inglizchaga, boshqa tildan o'zbekchaga tarjima qil. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber.", "model": "openai/gpt-oss-20b", "permissions": []},

  {"id": "moliya", "name": "Moliya maslahatchisi", "category": "Maslahat", "description": "Byudjet va xarajatlarni rejalashtirishga yordam beradi.", "prompt": "Sen moliyaviy savodxonlik bo'yicha yordamchisan. Byudjet, jamg'arma va xarajat rejasini tushuntir. Sen moliyaviy maslahatchi emassan va aniq investitsiya tavsiyasi bermaysan, buni aytib qo'y. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber.", "model": "openai/gpt-oss-120b", "permissions": []},
  {"id": "huquq", "name": "Huquqiy ma'lumot", "category": "Maslahat", "description": "Huquqiy tushunchalarni oddiy tilda tushuntiradi.", "prompt": "Sen huquqiy ma'lumot beruvchi yordamchisan. Tushunchalarni oddiy tilda tushuntir. Sen yurist emassan, aniq ish uchun malakali yurist bilan maslahatlashish kerakligini ayt va qonunlar o'zgarishi mumkinligini eslat. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber.", "model": "openai/gpt-oss-120b", "permissions": []}
];

/* ============================ YORDAMCHILAR ============================ */
const $app = document.getElementById("app");
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};
function el(tag, attrs = {}, ...kids){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)){
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
const FB_ON = !!(CONFIG.FIREBASE.apiKey && CONFIG.PROXY_URL);
let fbAuth = null, fbDb = null, session = null, catalog = AGENTS;
if (FB_ON){ const fbApp = initializeApp(CONFIG.FIREBASE); fbAuth = getAuth(fbApp); fbDb = getFirestore(fbApp); }
const profile = () => FB_ON ? session : store.get("profile", null);

async function loadCatalog(){
  try{
    const snap = await getDocs(collection(fbDb, "agents"));
    const list = snap.docs.map(d => ({permissions:[], ...d.data(), id:d.id}));
    if (list.length) catalog = list;
  }catch{}
}
async function fbCall(path, body){
  const idToken = await session.user.getIdToken();
  const r = await fetch(CONFIG.PROXY_URL + path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({idToken, ...body})});
  const d = await r.json().catch(() => ({}));
  return {ok:r.ok, d};
}
async function fbLogin(tg, name){
  const r = await fetch(CONFIG.PROXY_URL + "/auth", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({telegram:tg, name})});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Kirib bo'lmadi");
  const cred = await signInWithCustomToken(fbAuth, d.token);
  await setDoc(doc(fbDb, "users", cred.user.uid), {name, telegramId:tg.id, username:tg.username || null, lastLogin:serverTimestamp()}, {merge:true});
}
const usageOf = id => store.get("usage:" + id, 0);

/* Foydalanuvchi ma'lumoti: bir marta so'raladi, keyin saqlanadi */
const FIELDS = CONFIG.PROFILE_FIELDS || [];
let userInfo = FB_ON ? null : store.get("userinfo", null);
const infoMissing = () => !userInfo || FIELDS.some(f => !f.optional && !String(userInfo[f.key] ?? "").trim());
async function loadUserInfo(){
  try{ const s = await getDoc(doc(fbDb, "users", session.user.uid)); userInfo = s.exists() ? (s.data().profile || null) : null; }
  catch{ userInfo = null; }
}
async function saveUserInfo(data){
  userInfo = data;
  if (FB_ON){
    if (data.name) session.name = data.name;
    await setDoc(doc(fbDb, "users", session.user.uid), {profile:data, name:data.name || session.name}, {merge:true});
  } else {
    store.set("userinfo", data);
    const p = store.get("profile", null);
    if (p && data.name){ p.name = data.name; store.set("profile", p); }
  }
}
function renderProfile(p, editing){
  const inputs = {};
  const err = el("p", {class:"err", role:"alert"});
  const rows = FIELDS.map(f => {
    const v = userInfo?.[f.key] ?? (f.key === "name" && p.name !== "Foydalanuvchi" ? p.name : "");
    inputs[f.key] = el("input", {type:f.type === "number" ? "number" : "text", value:v, maxlength:"60", placeholder:f.placeholder || ""});
    return el("label", {}, f.label + (f.optional ? " (ixtiyoriy)" : ""), inputs[f.key]);
  });
  const btn = el("button", {class:"btn", onclick: async () => {
    const data = {};
    for (const f of FIELDS){
      const v = inputs[f.key].value.trim();
      if (!v && !f.optional){ err.textContent = `"${f.label}" maydonini to'ldiring.`; return; }
      if (v && f.type === "number" && !(Number(v) >= 1 && Number(v) <= 120)){ err.textContent = `"${f.label}" uchun to'g'ri raqam kiriting.`; return; }
      data[f.key] = v;
    }
    btn.disabled = true; err.textContent = "";
    try{ await saveUserInfo(data); }catch{ err.textContent = "Saqlab bo'lmadi. Qayta urinib ko'ring."; btn.disabled = false; return; }
    if (location.hash === "#/profile") location.hash = "#/"; else route();
  }}, "Saqlash");
  $app.replaceChildren(
    el("div", {class:"top"}, el("span", {class:"brand"}, "Agentlar"), editing ? el("a", {class:"link", href:"#/"}, "Orqaga") : null),
    el("h1", {}, editing ? "Ma'lumotlaringiz" : "O'zingiz haqingizda"),
    el("p", {class:"lead"}, editing ? "Kerak bo'lsa o'zgartiring." : "Bu ma'lumot faqat bir marta so'raladi va saqlanadi. Agentlar sizga mos javob berishi uchun kerak."),
    el("div", {class:"login"}, rows, btn, err));
}

/* ============================ KIRISH ============================ */
function renderLogin(){
  let error = el("p", {class:"err", role:"alert"});
  const nameInput = el("input", {type:"text", placeholder:"Masalan, Jasur", maxlength:"60"});
  const widget = el("div");

  function finish(tg){
    const name = nameInput.value.trim();
    if (!name){ error.textContent = "Avval ismingizni yozing."; return false; }
    if (FB_ON){
      if (!tg){ error.textContent = "Telegram sozlanmagan. CONFIG.TELEGRAM_BOT ni to'ldiring."; return false; }
      error.textContent = "";
      fbLogin(tg, name).catch(e => { error.textContent = e.message || "Kirib bo'lmadi"; });
      return true;
    }
    store.set("profile", {name, tg: tg || null});
    route();
    return true;
  }

  window.onTelegramAuth = tg => finish(tg);

  if (CONFIG.TELEGRAM_BOT){
    const s = document.createElement("script");
    s.src = "https://telegram.org/js/telegram-widget.js?22";
    s.async = true;
    s.setAttribute("data-telegram-login", CONFIG.TELEGRAM_BOT);
    s.setAttribute("data-size", "large");
    s.setAttribute("data-request-access", "write");
    s.setAttribute("data-onauth", "onTelegramAuth(user)");
    widget.append(s);
  } else {
    widget.append(el("button", {class:"btn", onclick:() => finish(null)}, "Sinov rejimida kirish"));
  }

  $app.replaceChildren(
    el("div", {class:"top"}, el("span", {class:"brand"}, "Agentlar")),
    el("h1", {}, "Kerakli agentni tanlang. U ishni bajaradi."),
    el("p", {class:"lead"}, "Kod, tarjima, marketing, Telegram va boshqa vazifalar uchun alohida agentlar."),
    el("div", {class:"login"},
      el("label", {}, "Ismingiz", nameInput),
      widget,
      el("p", {class:"note"}, CONFIG.TELEGRAM_BOT
        ? "Telegram orqali kirasiz. Agent qayerdadir ishlashi kerak bo'lsa, alohida ruxsat so'raladi."
        : "Telegram hali sozlanmagan, shuning uchun sinov rejimi."),
      error)
  );
}

/* ============================ BOSH SAHIFA ============================ */
function renderHome(p){
  const list = el("div");
  const search = el("input", {type:"search", placeholder:"Agent yoki vazifani qidiring", "aria-label":"Qidiruv"});

  function draw(){
    const term = search.value.trim().toLowerCase();
    const found = catalog.filter(a => !term || (a.name + " " + a.description + " " + a.category).toLowerCase().includes(term));
    const groups = new Map();
    found.forEach(a => groups.set(a.category, [...(groups.get(a.category) || []), a]));
    if (!groups.size){ list.replaceChildren(el("p", {class:"empty"}, "Hech narsa topilmadi. Boshqa so'z bilan qidiring.")); return; }
    list.replaceChildren(...[...groups].map(([cat, items]) =>
      el("section", {class:"cat"},
        el("h2", {}, cat),
        el("div", {class:"rows"}, items.map(a =>
          el("a", {class:"row", href:"#/agent/" + a.id},
            el("b", {}, a.name),
            el("span", {}, a.description),
            a.permissions.length ? el("span", {}, el("i", {class:"chip"}, "Ruxsat: " + a.permissions.join(", "))) : null,
            el("span", {class:"go"}, "Ochish"))))
      )));
  }
  search.addEventListener("input", draw);

  $app.replaceChildren(
    el("div", {class:"top"},
      el("span", {class:"brand"}, "Agentlar"),
      el("span", {class:"who"}, p.name, el("a", {class:"link", href:"#/profile"}, "Profil"), FB_ON ? null : el("button", {class:"link", onclick:() => { store.del("profile"); route(); }}, "Chiqish"))),
    el("div", {class:"search"}, search),
    list);
  draw();
}

/* ============================ AGENT SAHIFASI ============================ */
function renderAgent(p, agent){
  const msgs = [];
  let busy = false;
  let used = usageOf(agent.id);
  let limit = CONFIG.DEFAULT_LIMIT;

  const bar = el("i");
  const usageText = el("small");
  const chat = el("div", {class:"chat", "aria-live":"polite"});
  const error = el("p", {class:"err", role:"alert"});
  const input = el("textarea", {rows:"3", placeholder:"Vazifani yozing"});
  const sendBtn = el("button", {class:"btn"}, "Yuborish");

  /* Telegram kanalga avtomatik yuborish (faqat Telegram kanal agentida) */
  const isTg = agent.id === "telegram-post";
  const chanInput = el("input", {type:"text", placeholder:"@kanal_username", value:store.get("tg_channel", "")});
  const consent = el("input", {type:"checkbox"});
  consent.checked = !!store.get("tg_consent", false);
  chanInput.addEventListener("change", () => store.set("tg_channel", chanInput.value.trim()));
  consent.addEventListener("change", () => store.set("tg_consent", consent.checked));
  const tgBox = el("div", {class:"keybox"},
    el("label", {}, "Kanalingiz @username", chanInput),
    el("label", {style:"display:flex;gap:10px;align-items:flex-start;font-weight:400"}, consent,
      "Agent tayyorlagan postlarni shu kanalga yuborishiga roziman. Buning uchun @agentuz1209_bot ni kanalga admin qilib qo'shganman (Post messages huquqi bilan)."),
    el("p", {class:"note"}, "Rozilik bermasangiz, agent faqat matn tayyorlaydi."));

  function drawUsage(){
    const pct = Math.min(100, Math.round(used / limit * 100));
    usageText.textContent = `API sarfi: ${used.toLocaleString()} / ${limit.toLocaleString()} token (${pct}%)`;
    bar.style.width = pct + "%";
    bar.className = used >= limit ? "full" : "";
    const full = used >= limit;
    input.disabled = full;
    input.placeholder = full ? "Limit tugadi" : "Vazifani yozing";
    sendBtn.disabled = busy || full;
  }

  const useProxy = FB_ON;
  const keyBox = el("div", {class:"keybox"});
  function drawKeyBox(){
    if (useProxy || store.get("groq_key", "")){ keyBox.replaceChildren(); keyBox.style.display = "none"; return; }
    keyBox.style.display = "";
    const k = el("input", {type:"password", placeholder:"gsk_...", autocomplete:"off"});
    keyBox.replaceChildren(
      el("label", {}, "Groq API kalitingiz", k),
      el("p", {class:"note"}, "Kalit faqat shu brauzerda saqlanadi va faqat Groq'ga yuboriladi. console.groq.com/keys dan oling."),
      el("button", {class:"btn alt", onclick:() => { const v = k.value.trim(); if (v){ store.set("groq_key", v); drawKeyBox(); } }}, "Saqlash"));
  }

  function addMsg(role, text){ chat.append(el("div", {class:"msg " + role}, text)); chat.lastChild.scrollIntoView({behavior:"smooth", block:"end"}); }

  async function ask(history){
    const system = agent.prompt;
    if (FB_ON){
      const {ok, d} = await fbCall("/chat", {agentId:agent.id, messages:history, ...(isTg ? {channel:chanInput.value.trim(), consent:consent.checked} : {})});
      if (d.limit){ used = d.used; limit = d.limit; }
      if (!ok) throw new Error(d.error || "Agent javob bera olmadi");
      return d.reply || "";
    }
    const key = store.get("groq_key", "");
    if (!key) throw new Error("Avval Groq kalitingizni kiriting.");
    const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json", Authorization:"Bearer " + key},
      body: JSON.stringify({model:CONFIG.GROQ_MODEL, messages:[{role:"system", content:system}, ...history]})
    });
    if (r.status === 401){ store.del("groq_key"); drawKeyBox(); throw new Error("Groq kaliti noto'g'ri. Qayta kiriting."); }
    if (r.status === 429) throw new Error("Groq so'rov limiti vaqtincha tugadi. Birozdan keyin urinib ko'ring.");
    if (!r.ok) throw new Error("Agent javob bera olmadi");
    const d = await r.json();
    used += d.usage?.total_tokens || 0;
    store.set("usage:" + agent.id, used);
    return d.choices?.[0]?.message?.content || "";
  }

  async function send(){
    const text = input.value.trim();
    if (!text || busy || used >= limit) return;
    msgs.push({role:"user", content:text});
    addMsg("user", text);
    input.value = "";
    error.textContent = "";
    busy = true; drawUsage();
    const wait = el("div", {class:"msg assistant"}, "Agent ishlayapti...");
    chat.append(wait);
    try {
      const reply = await ask(msgs.slice(-20));
      msgs.push({role:"assistant", content:reply});
      wait.remove(); addMsg("assistant", reply);
    } catch (e) {
      wait.remove(); error.textContent = e.message || "Xatolik yuz berdi";
    }
    busy = false; drawUsage();
  }
  sendBtn.addEventListener("click", send);

  $app.replaceChildren(
    el("div", {class:"top"}, el("a", {class:"brand", href:"#/"}, "Agentlar"), el("span", {class:"who"}, p.name)),
    el("h1", {}, agent.name),
    el("p", {class:"lead"}, agent.description),
    el("div", {class:"usage"}, usageText, el("div", {class:"bar"}, bar)),
    keyBox, isTg ? tgBox : null, chat, error,
    el("div", {class:"composer"}, input, sendBtn));
  drawKeyBox(); drawUsage();
  // Agent suhbatni o'zi boshlaydi: salomlashadi va vazifa uchun yetishmayotgan ma'lumotni so'raydi
  const START = "Suhbatni boshla: mening ismim bilan salomlash va o'zingni bir jumlada tanishtir. Yetishmayotgan ma'lumotlardan birinchisini so'ra. Agar hammasi bor bo'lsa, vazifani yozishni so'ra. Tayyor natija yozma.";
  async function begin(){
    if (used >= limit) return;
    msgs.push({role:"user", content:START});
    busy = true; drawUsage();
    const wait = el("div", {class:"msg assistant"}, "Agent ishlayapti...");
    chat.append(wait);
    try {
      const reply = await ask(msgs.slice(-20));
      msgs.push({role:"assistant", content:reply});
      wait.remove(); addMsg("assistant", reply);
    } catch (e) {
      wait.remove(); msgs.pop(); error.textContent = e.message || "Xatolik yuz berdi";
    }
    busy = false; drawUsage();
  }
  if (FB_ON) fbCall("/usage", {agentId:agent.id})
    .then(({d}) => { if (d.limit){ used = d.used; limit = d.limit; drawUsage(); } })
    .catch(() => {})
    .then(begin);
}

/* ============================ YO'NALTIRISH ============================ */
function route(){
  const p = profile();
  if (!p) return renderLogin();
  if (infoMissing()) return renderProfile(p, false);
  if (location.hash === "#/profile") return renderProfile(p, true);
  const m = location.hash.match(/^#\/agent\/([\w-]+)/);
  if (m){
    const a = catalog.find(x => x.id === m[1]);
    if (a) return renderAgent(p, a);
  }
  renderHome(p);
}
addEventListener("hashchange", route);
function fatal(e){
  const code = e?.code || "";
  const msg = (code === "auth/operation-not-allowed" || code === "auth/admin-restricted-operation")
    ? "Firebase > Authentication > Sign-in method bo'limida Anonymous kirishni yoqing."
    : code === "auth/configuration-not-found"
      ? "Firebase > Authentication bo'limida Get started tugmasini bosing."
      : (e?.message || "Noma'lum xato");
  $app.replaceChildren(el("h1", {}, "Ulanib bo'lmadi"), el("p", {class:"lead"}, msg));
}
if (FB_ON){
  $app.replaceChildren(el("p", {class:"lead"}, "Yuklanmoqda..."));
  onAuthStateChanged(fbAuth, async u => {
    if (!u){
      session = null; userInfo = null;
      try { await signInAnonymously(fbAuth); } catch (e) { fatal(e); }
      return;
    }
    session = {name:"Foydalanuvchi", user:u, tg:null};
    await Promise.all([loadCatalog(), loadUserInfo()]);
    if (userInfo?.name) session.name = userInfo.name;
    route();
  });
} else route();
</script>
