<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{--paper:#f1f4ee;--ink:#13201a;--muted:#5d6b63;--line:#d3dacf;--cobalt:#2a4bd7;--saffron:#f0b429;--white:#fff;--danger:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5;font-size:16px}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px 80px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px;gap:12px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.who{font-size:14px;color:var(--muted);display:flex;gap:12px;align-items:center}
.link{background:none;border:0;padding:0;font:inherit;color:var(--cobalt);cursor:pointer;text-decoration:underline}
h1{font-size:clamp(34px,7vw,56px);line-height:1.02;letter-spacing:-.035em;margin:0 0 12px;font-weight:800}
.lead{color:var(--muted);margin:0 0 32px;max-width:46ch}
.login{display:grid;gap:16px;max-width:420px}
label{font-weight:600;font-size:14px;display:grid;gap:6px}
input[type=text],input[type=search],input[type=password],textarea{font:inherit;padding:12px 14px;border:1.5px solid var(--ink);background:var(--white);border-radius:6px;width:100%;color:var(--ink)}
select{font:inherit;padding:12px 14px;border:1.5px solid var(--ink);background:var(--white);border-radius:6px;color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--danger);font-size:14px;margin:0}
.search{margin-bottom:36px}.search input{font-size:18px;padding:16px 18px}
.cat{margin-bottom:32px}.cat h2{font-size:15px;font-weight:700;margin:0 0 4px;color:var(--cobalt)}
.rows{border-top:1.5px solid var(--ink)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:16px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.row:hover{background:var(--white)}
.row b{font-size:18px;letter-spacing:-.01em}.row span{color:var(--muted);font-size:15px;grid-column:1}
.row .go{grid-column:2;grid-row:1/span 2;align-self:center;font-weight:700;color:var(--cobalt)}
.chip{display:inline-block;font-size:12px;background:var(--saffron);color:var(--ink);padding:2px 8px;border-radius:99px;margin-top:6px;font-weight:600;font-style:normal}
.empty{color:var(--muted);padding:24px 0}
.chat{display:grid;gap:14px;margin-bottom:20px}
.msg{padding:12px 14px;border-radius:6px;white-space:pre-wrap;word-break:break-word;max-width:92%}
.msg.user{background:var(--ink);color:var(--white);justify-self:end}
.msg.assistant{background:var(--white);border:1px solid var(--line)}
.composer{display:grid;gap:10px;position:sticky;bottom:0;background:var(--paper);padding:12px 0}
.btn{font:inherit;font-weight:700;padding:12px 20px;background:var(--cobalt);color:var(--white);border:0;border-radius:6px;cursor:pointer;justify-self:start}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.alt{background:var(--ink)}
.usage{margin:16px 0 28px}.usage small{color:var(--muted);display:block;margin-bottom:6px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--saffron);transition:width .4s}.bar i.full{background:var(--danger)}
.keybox{border:1.5px solid var(--ink);padding:16px;border-radius:6px;background:var(--white);display:grid;gap:10px;margin-bottom:24px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, getDocs, getDoc, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

/* ============================ SOZLAMALAR ============================ */
const CONFIG = {
  // @BotFather'dagi bot username'i (@ belgisiz). Bo'sh bo'lsa, sinov rejimi.

  FIREBASE: { apiKey: "AIzaSyAPnIC0G1bpVAL-l6M55Qn7pLGEW9LspWI", authDomain: "agentuz-f9ff1.firebaseapp.com", projectId: "agentuz-f9ff1", appId: "1:517712990457:web:4f1e9c4fcf0616119d5228" },
  // Groq model nomi (faqat kalit to'g'ridan-to'g'ri ishlatilganda; proksida worker belgilaydi)

  DEFAULT_LIMIT: 40000
};

/* Yangi agent qo'shish: shu ro'yxatga yangi element qo'shing */
const AGENTS = [
  {"id": "xato", "name": "Xato topuvchi", "category": "Tekshiruv", "description": "Kod, email, chat va boshqa matnlardagi xatolarni topib, tuzatib beradi.", "prompt": "Sen xato topuvchi mutaxassisisan. Foydalanuvchi bergan HAR QANDAY matnni tekshir: dasturlash kodi, email, chat xabari, hujjat, xato xabari (log) va boshqalar. Avval bu nima ekanini aniqla. Keyin faqat topilgan xatolarni ro'yxat qil: qayeri (qator yoki iboraga ishora), nima xato va nega. So'ng tuzatilgan variantni ber. Kodda ishlamaydigan joylarni ham, mantiqiy xatolarni ham ko'rsat. Xato bo'lmasa, \"xato topilmadi\" de va to'qima. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber.", "model": "openai/gpt-oss-120b", "permissions": []},
  {"id": "imlo", "name": "Imlo tuzatuvchi", "category": "Tekshiruv", "description": "Har qanday tilda imlo, tinish belgisi va grammatika xatolarini topadi. Yozing yoki gapiring.", "prompt": "Sen korrektorsan. Matn qaysi tilda bo'lsa (o'zbek, rus, ingliz, nemis va boshqalar), tilni o'zing aniqla va xatolarni o'sha til qoidasi bo'yicha top: imlo, tinish belgilari, grammatika, uslub. Matn ovozdan yozilgan bo'lishi mumkin (tinish belgilari kam bo'ladi), shunga e'tibor ber. Avval tuzatilgan matnni ber, keyin har bir xatoni ro'yxat qil: noto'g'ri → to'g'ri, qisqa sababi. Xato bo'lmasa, shuni ayt. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber.", "model": "openai/gpt-oss-20b", "permissions": []},
  {"id": "excel", "name": "Excel yordamchi", "category": "Tahlil", "description": "Excel jadval, formula va diagramma yaratadi, tayyor faylni yuklab beradi.", "prompt": "Sen Excel mutaxassisisan. Vazifaga qarab formula, jadval yoki diagramma ber. Fayl kerak bo'lsa, javobingning oxirida [[EXCEL]]JSON[[/EXCEL]] blokini yoz, sayt undan .xlsx fayl va diagramma yaratadi. JSON formati: {\"nom\":\"fayl_nomi\",\"sheets\":[{\"name\":\"Varaq1\",\"rows\":[[\"Sarlavha1\",\"Sarlavha2\"],[\"a\",1],[\"Jami\",\"=SUM(B2:B10)\"]]}],\"chart\":{\"type\":\"bar\",\"title\":\"Sarlavha\",\"labels\":[\"a\",\"b\"],\"values\":[1,2]}}. Formulalar \"=\" bilan boshlanadi. \"chart\" faqat diagramma kerak bo'lsa, type: bar, line yoki pie. Katakda faqat matn yoki raqam bo'lsin. JSON to'g'ri bo'lsin: izohsiz va ``` belgilarsiz. Blokdan tashqarida qisqa tushuntir. Video yoki rasm yarata olmaysan, so'ralsa shuni ayt. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber.", "model": "openai/gpt-oss-120b", "permissions": []},
  {"id": "marketing", "name": "Marketing yordamchi", "category": "Biznes", "description": "Reklama matni, post va sotuv g'oyalarini tayyorlaydi.", "prompt": "Sen marketing mutaxassisisan. Kichik biznes uchun qisqa, aniq va sotadigan matnlar yoz. Instagram va Telegram uchun moslashtir. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber.", "model": "openai/gpt-oss-20b", "permissions": ["Telegram kanalga yuborish"]},
  {"id": "reklama", "name": "Reklama sloganlari", "category": "Biznes", "description": "Qisqa reklama va slogan variantlarini yozadi.", "prompt": "Sen kopirayter. Mahsulot uchun 5 ta turli uslubdagi qisqa reklama matni va slogan ber. Haqiqatga to'g'ri kelmaydigan va'dalar yozma. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber.", "model": "openai/gpt-oss-20b", "permissions": ["Telegram kanalga yuborish"]},
  {"id": "telegram-post", "name": "Telegram kanal agenti", "category": "Telegram", "description": "Kanal uchun postlar rejasi va matnlarini yozadi va kanalga yuboradi.", "prompt": "Sen Telegram kanal muharririsan. Kanal mavzusiga mos post rejasi va tayyor matnlar yoz. Matnlar qisqa va qiziqarli bo'lsin. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber.", "model": "openai/gpt-oss-120b", "permissions": ["Telegram kanalga yuborish"]},
  {"id": "instagram", "name": "Instagram kontent", "category": "Telegram", "description": "Instagram uchun g'oya, sarlavha, matn va xeshteglar tayyorlaydi.", "prompt": "Sen ijtimoiy tarmoq kontent menejerisan. Post g'oyalari, sarlavha, qisqa matn va mos xeshteglar ber. Haftalik kontent jadvali ham tuz. Instagramga o'zing joylay olmaysan: tayyor matnni foydalanuvchi o'zi joylaydi, so'ralsa shuni ayt. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber.", "model": "openai/gpt-oss-20b", "permissions": ["Telegram kanalga yuborish"]},
  {"id": "yozuvchi", "name": "Matn yozuvchi", "category": "Yozuv", "description": "Xat, maqola va matnlar yozadi.", "prompt": "Sen matn yozuvchisan. So'ralgan matnni toza, rasmiy yoki do'stona uslubda yoz. Kerak bo'lsa avval bitta aniqlashtiruvchi savol ber. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber.", "model": "openai/gpt-oss-20b", "permissions": ["Telegram kanalga yuborish"]},
  {"id": "hikoya", "name": "Ijodiy yozuvchi", "category": "Yozuv", "description": "Hikoya, she'r va ssenariy g'oyalarini yozadi.", "prompt": "Sen ijodkor yozuvchisan. So'ralgan mavzuda qiziqarli hikoya, ssenariy yoki g'oyalar yoz. Mavjud mashhur asarlardan matn ko'chirma. Foydalanuvchi qaysi tilda yozsa, o'sha tilda (odatda o'zbekcha) javob ber.", "model": "qwen/qwen3.8-27b", "permissions": ["Telegram kanalga yuborish"]}
];

/* Telegram kanalga avtomatik yuborish mumkin bo'lgan agentlar (server bilan bir xil bo'lsin) */
const TG_AGENTS = ["telegram-post", "instagram", "marketing", "reklama", "yozuvchi", "hikoya"];


/* ============================ EXCEL VA DIAGRAMMA ============================ */
const EXCEL_RE = /\[\[EXCEL\]\]([\s\S]*?)\[\[\/EXCEL\]\]/;
function parseExcel(text){
  const m = text.match(EXCEL_RE);
  if (!m) return {text, spec:null, bad:false};
  let spec = null;
  try { spec = JSON.parse(m[1].replace(/```json|```/g, "").trim()); } catch {}
  return {text: text.replace(EXCEL_RE, "").trim(), spec, bad: !spec};
}
const loaded = {};
function loadScript(src){
  if (!loaded[src]) loaded[src] = new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => { delete loaded[src]; fail(new Error("Kutubxona yuklanmadi")); };
    document.head.append(s);
  });
  return loaded[src];
}
async function downloadXlsx(spec){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
  const wb = XLSX.utils.book_new();
  const sheets = Array.isArray(spec.sheets) && spec.sheets.length ? spec.sheets : [{name:"Varaq1", rows:[]}];
  sheets.slice(0, 10).forEach((sh, i) => {
    const rows = (Array.isArray(sh.rows) ? sh.rows : []).map(r => (Array.isArray(r) ? r : [r]).map(c => typeof c === "string" && c.startsWith("=") ? {t:"n", f:c.slice(1)} : c));
    const name = String(sh.name || "").replace(/[\\\/\?\*\[\]:]/g, "").slice(0, 31) || "Varaq" + (i + 1);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), name);
  });
  const file = String(spec.nom || "jadval").replace(/[^\w\-]+/g, "_").slice(0, 40) || "jadval";
  XLSX.writeFile(wb, file + ".xlsx");
}
async function drawChart(spec, box){
  const c = spec.chart;
  if (!c || !Array.isArray(c.labels) || !Array.isArray(c.values)) return;
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js");
  const type = ["bar", "line", "pie"].includes(c.type) ? c.type : "bar";
  const canvas = el("canvas");
  const wrap = el("div", {style:"position:relative;height:280px;margin-top:10px;background:#fff"}, canvas);
  box.append(wrap);
  new Chart(canvas, {
    type,
    data:{labels:c.labels, datasets:[{label:String(c.title || ""), data:c.values}]},
    options:{responsive:true, maintainAspectRatio:false, animation:false, plugins:{title:{display:!!c.title, text:String(c.title || "")}}},
    plugins:[{id:"bg", beforeDraw(ch){ const x = ch.ctx; x.save(); x.globalCompositeOperation = "destination-over"; x.fillStyle = "#fff"; x.fillRect(0, 0, ch.width, ch.height); x.restore(); }}]
  });
  const b = el("button", {class:"link", style:"display:block;margin-top:8px"}, "Diagrammani yuklab olish (PNG)");
  b.addEventListener("click", () => { const a = document.createElement("a"); a.href = canvas.toDataURL("image/png"); a.download = "diagramma.png"; a.click(); });
  box.append(b);
}

/* ============================ YORDAMCHILAR ============================ */
const $app = document.getElementById("app");
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};
function el(tag, attrs = {}, ...kids){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)){
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
const FB_ON = !!(CONFIG.FIREBASE.apiKey && CONFIG.PROXY_URL);
let fbAuth = null, fbDb = null, session = null, catalog = AGENTS;
if (FB_ON){ const fbApp = initializeApp(CONFIG.FIREBASE); fbAuth = getAuth(fbApp); fbDb = getFirestore(fbApp); }
const profile = () => FB_ON ? session : store.get("profile", null);

async function loadCatalog(){
  try{
    const snap = await getDocs(collection(fbDb, "agents"));
    const list = snap.docs.map(d => ({permissions:[], ...d.data(), id:d.id}));
    if (list.length) catalog = list;
  }catch{}
}
async function fbCall(path, body){
  const idToken = await session.user.getIdToken();
  const r = await fetch(CONFIG.PROXY_URL + path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({idToken, ...body})});
  const d = await r.json().catch(() => ({}));
  return {ok:r.ok, d};
}
async function fbLogin(tg, name){
  const r = await fetch(CONFIG.PROXY_URL + "/auth", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({telegram:tg, name})});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Kirib bo'lmadi");
  const cred = await signInWithCustomToken(fbAuth, d.token);
  await setDoc(doc(fbDb, "users", cred.user.uid), {name, telegramId:tg.id, username:tg.username || null, lastLogin:serverTimestamp()}, {merge:true});
}
const usageOf = id => store.get("usage:" + id, 0);

/* Foydalanuvchi ma'lumoti: bir marta so'raladi, keyin saqlanadi */
const FIELDS = CONFIG.PROFILE_FIELDS || [];
let userInfo = FB_ON ? null : store.get("userinfo", null);
const infoMissing = () => !userInfo || FIELDS.some(f => !f.optional && !String(userInfo[f.key] ?? "").trim());
async function loadUserInfo(){
  try{ const s = await getDoc(doc(fbDb, "users", session.user.uid)); userInfo = s.exists() ? (s.data().profile || null) : null; }
  catch{ userInfo = null; }
}
async function saveUserInfo(data){
  userInfo = data;
  if (FB_ON){
    if (data.name) session.name = data.name;
    await setDoc(doc(fbDb, "users", session.user.uid), {profile:data, name:data.name || session.name}, {merge:true});
  } else {
    store.set("userinfo", data);
    const p = store.get("profile", null);
    if (p && data.name){ p.name = data.name; store.set("profile", p); }
  }
}
function renderProfile(p, editing){
  const inputs = {};
  const err = el("p", {class:"err", role:"alert"});
  const rows = FIELDS.map(f => {
    const v = userInfo?.[f.key] ?? (f.key === "name" && p.name !== "Foydalanuvchi" ? p.name : "");
    inputs[f.key] = el("input", {type:f.type === "number" ? "number" : "text", value:v, maxlength:"60", placeholder:f.placeholder || ""});
    return el("label", {}, f.label + (f.optional ? " (ixtiyoriy)" : ""), inputs[f.key]);
  });
  const btn = el("button", {class:"btn", onclick: async () => {
    const data = {};
    for (const f of FIELDS){
      const v = inputs[f.key].value.trim();
      if (!v && !f.optional){ err.textContent = `"${f.label}" maydonini to'ldiring.`; return; }
      if (v && f.type === "number" && !(Number(v) >= 1 && Number(v) <= 120)){ err.textContent = `"${f.label}" uchun to'g'ri raqam kiriting.`; return; }
      data[f.key] = v;
    }
    btn.disabled = true; err.textContent = "";
    try{ await saveUserInfo(data); }catch{ err.textContent = "Saqlab bo'lmadi. Qayta urinib ko'ring."; btn.disabled = false; return; }
    if (location.hash === "#/profile") location.hash = "#/"; else route();
  }}, "Saqlash");
  $app.replaceChildren(
    el("div", {class:"top"}, el("span", {class:"brand"}, "Agentlar"), editing ? el("a", {class:"link", href:"#/"}, "Orqaga") : null),
    el("h1", {}, editing ? "Ma'lumotlaringiz" : "O'zingiz haqingizda"),
    el("p", {class:"lead"}, editing ? "Kerak bo'lsa o'zgartiring." : "Bu ma'lumot faqat bir marta so'raladi va saqlanadi. Agentlar sizga mos javob berishi uchun kerak."),
    el("div", {class:"login"}, rows, btn, err));
}

/* ============================ KIRISH ============================ */
function renderLogin(){
  let error = el("p", {class:"err", role:"alert"});
  const nameInput = el("input", {type:"text", placeholder:"Masalan, Jasur", maxlength:"60"});
  const widget = el("div");

  function finish(tg){
    const name = nameInput.value.trim();
    if (!name){ error.textContent = "Avval ismingizni yozing."; return false; }
    if (FB_ON){
      if (!tg){ error.textContent = "Telegram sozlanmagan. CONFIG.TELEGRAM_BOT ni to'ldiring."; return false; }
      error.textContent = "";
      fbLogin(tg, name).catch(e => { error.textContent = e.message || "Kirib bo'lmadi"; });
      return true;
    }
    store.set("profile", {name, tg: tg || null});
    route();
    return true;
  }

  window.onTelegramAuth = tg => finish(tg);

  if (CONFIG.TELEGRAM_BOT){
    const s = document.createElement("script");
    s.src = "https://telegram.org/js/telegram-widget.js?22";
    s.async = true;
    s.setAttribute("data-telegram-login", CONFIG.TELEGRAM_BOT);
    s.setAttribute("data-size", "large");
    s.setAttribute("data-request-access", "write");
    s.setAttribute("data-onauth", "onTelegramAuth(user)");
    widget.append(s);
  } else {
    widget.append(el("button", {class:"btn", onclick:() => finish(null)}, "Sinov rejimida kirish"));
  }

  $app.replaceChildren(
    el("div", {class:"top"}, el("span", {class:"brand"}, "Agentlar")),
    el("h1", {}, "Kerakli agentni tanlang. U ishni bajaradi."),
    el("p", {class:"lead"}, "Kod, tarjima, marketing, Telegram va boshqa vazifalar uchun alohida agentlar."),
    el("div", {class:"login"},
      el("label", {}, "Ismingiz", nameInput),
      widget,
      el("p", {class:"note"}, CONFIG.TELEGRAM_BOT
        ? "Telegram orqali kirasiz. Agent qayerdadir ishlashi kerak bo'lsa, alohida ruxsat so'raladi."
        : "Telegram hali sozlanmagan, shuning uchun sinov rejimi."),
      error)
  );
}

/* ============================ BOSH SAHIFA ============================ */
function renderHome(p){
  const list = el("div");
  const search = el("input", {type:"search", placeholder:"Agent yoki vazifani qidiring", "aria-label":"Qidiruv"});

  function draw(){
    const term = search.value.trim().toLowerCase();
    const found = catalog.filter(a => !term || (a.name + " " + a.description + " " + a.category).toLowerCase().includes(term));
    const groups = new Map();
    found.forEach(a => groups.set(a.category, [...(groups.get(a.category) || []), a]));
    if (!groups.size){ list.replaceChildren(el("p", {class:"empty"}, "Hech narsa topilmadi. Boshqa so'z bilan qidiring.")); return; }
    list.replaceChildren(...[...groups].map(([cat, items]) =>
      el("section", {class:"cat"},
        el("h2", {}, cat),
        el("div", {class:"rows"}, items.map(a =>
          el("a", {class:"row", href:"#/agent/" + a.id},
            el("b", {}, a.name),
            el("span", {}, a.description),
            a.permissions.length ? el("span", {}, el("i", {class:"chip"}, "Ruxsat: " + a.permissions.join(", "))) : null,
            el("span", {class:"go"}, "Ochish"))))
      )));
  }
  search.addEventListener("input", draw);

  $app.replaceChildren(
    el("div", {class:"top"},
      el("span", {class:"brand"}, "Agentlar"),
      el("span", {class:"who"}, p.name, el("a", {class:"link", href:"#/profile"}, "Profil"), FB_ON ? null : el("button", {class:"link", onclick:() => { store.del("profile"); route(); }}, "Chiqish"))),
    el("div", {class:"search"}, search),
    list);
  draw();
}

/* ============================ AGENT SAHIFASI ============================ */
function renderAgent(p, agent){
  const msgs = [];
  let busy = false;
  let used = usageOf(agent.id);
  let limit = CONFIG.DEFAULT_LIMIT;

  const bar = el("i");
  const usageText = el("small");
  const chat = el("div", {class:"chat", "aria-live":"polite"});
  const error = el("p", {class:"err", role:"alert"});
  const input = el("textarea", {rows:"3", placeholder:"Vazifani yozing"});
  const sendBtn = el("button", {class:"btn"}, "Yuborish");

  /* Telegram kanalga avtomatik yuborish (TG_AGENTS dagi agentlarda) */
  const isTg = TG_AGENTS.includes(agent.id);
  const chanInput = el("input", {type:"text", placeholder:"@kanal_username", value:store.get("tg_channel", "")});
  const consent = el("input", {type:"checkbox"});
  consent.checked = !!store.get("tg_consent", false);
  chanInput.addEventListener("change", () => store.set("tg_channel", chanInput.value.trim()));
  consent.addEventListener("change", () => store.set("tg_consent", consent.checked));
  const tgBox = el("div", {class:"keybox"},
    el("label", {}, "Kanalingiz @username", chanInput),
    el("label", {style:"display:flex;gap:10px;align-items:flex-start;font-weight:400"}, consent,
      "Agent tayyorlagan postlarni shu kanalga yuborishiga roziman. Buning uchun @agentuz1209_bot ni kanalga admin qilib qo'shganman (Post messages huquqi bilan)."),
    el("p", {class:"note"}, "Rozilik bermasangiz, agent faqat matn tayyorlaydi."));

  /* Ovoz bilan kiritish (faqat Imlo tuzatuvchi) */
  const isVoice = agent.id === "imlo";
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const langSel = el("select", {}, ...[["uz-UZ","O'zbekcha"],["ru-RU","Ruscha"],["en-US","Inglizcha"],["de-DE","Nemischa"]].map(([v, l]) => el("option", {value:v}, l)));
  let rec = null;
  const micBtn = el("button", {class:"btn alt"}, "Gapirish");
  micBtn.addEventListener("click", () => {
    if (!SR){ error.textContent = "Brauzeringiz ovozni matnga o'tkazishni qo'llamaydi. Chrome yoki Edge ishlating."; return; }
    if (rec){ rec.stop(); return; }
    rec = new SR(); rec.lang = langSel.value; rec.interimResults = false; rec.continuous = true;
    rec.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) input.value = (input.value + " " + e.results[i][0].transcript).trim(); };
    rec.onend = () => { rec = null; micBtn.textContent = "Gapirish"; };
    rec.onerror = ev => { error.textContent = "Mikrofon xatosi: " + (ev.error || ""); };
    micBtn.textContent = "To'xtatish"; error.textContent = "";
    rec.start();
  });
  const voiceBox = el("div", {class:"keybox"},
    el("label", {}, "Gapirish tili", langSel), micBtn,
    el("p", {class:"note"}, "Gapiring, matn pastdagi maydonga yoziladi. Keyin Yuborish ni bosing."));


  function drawUsage(){
    const pct = Math.min(100, Math.round(used / limit * 100));
    usageText.textContent = `API sarfi: ${used.toLocaleString()} / ${limit.toLocaleString()} token (${pct}%)`;
    bar.style.width = pct + "%";
    bar.className = used >= limit ? "full" : "";
    const full = used >= limit;
    input.disabled = full;
    input.placeholder = full ? "Limit tugadi" : "Vazifani yozing";
    sendBtn.disabled = busy || full;
  }

  const useProxy = FB_ON;
  const keyBox = el("div", {class:"keybox"});
  function drawKeyBox(){
    if (useProxy || store.get("groq_key", "")){ keyBox.replaceChildren(); keyBox.style.display = "none"; return; }
    keyBox.style.display = "";
    const k = el("input", {type:"password", placeholder:"gsk_...", autocomplete:"off"});
    keyBox.replaceChildren(
      el("label", {}, "Groq API kalitingiz", k),
      el("p", {class:"note"}, "Kalit faqat shu brauzerda saqlanadi va faqat Groq'ga yuboriladi. console.groq.com/keys dan oling."),
      el("button", {class:"btn alt", onclick:() => { const v = k.value.trim(); if (v){ store.set("groq_key", v); drawKeyBox(); } }}, "Saqlash"));
  }

  function addMsg(role, text, intro){
    const ex = role === "assistant" ? parseExcel(text) : {text, spec:null, bad:false};
    const shown = ex.text;
    const m = el("div", {class:"msg " + role}, shown);
    if (role === "assistant" && !intro){
      const b = el("button", {class:"link", style:"display:block;margin-top:8px"}, "Nusxalash");
      b.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(shown); b.textContent = "Nusxalandi"; }
        catch { b.textContent = "Nusxalab bo'lmadi"; }
      });
      m.append(b);
    }
    if (ex.spec){
      const x = el("button", {class:"btn alt", style:"margin-top:10px"}, "Excel faylini yuklab olish");
      x.addEventListener("click", async () => {
        x.disabled = true;
        try { await downloadXlsx(ex.spec); } catch (e) { error.textContent = e.message || "Fayl yaratib bo'lmadi"; }
        x.disabled = false;
      });
      m.append(el("div", {}, x));
      drawChart(ex.spec, m).catch(() => {});
    } else if (ex.bad){
      m.append(el("p", {class:"note"}, "Fayl yaratib bo'lmadi (ma'lumot formati xato). Qayta so'rab ko'ring."));
    }
    chat.append(m);
    m.scrollIntoView({behavior:"smooth", block:"end"});
  }

  async function ask(history){
    const system = agent.prompt;
    if (FB_ON){
      const {ok, d} = await fbCall("/chat", {agentId:agent.id, messages:history, ...(isTg ? {channel:chanInput.value.trim(), consent:consent.checked} : {})});
      if (d.limit){ used = d.used; limit = d.limit; }
      if (!ok) throw new Error(d.error || "Agent javob bera olmadi");
      return d.reply || "";
    }
    const key = store.get("groq_key", "");
    if (!key) throw new Error("Avval Groq kalitingizni kiriting.");
    const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json", Authorization:"Bearer " + key},
      body: JSON.stringify({model:CONFIG.GROQ_MODEL, messages:[{role:"system", content:system}, ...history]})
    });
    if (r.status === 401){ store.del("groq_key"); drawKeyBox(); throw new Error("Groq kaliti noto'g'ri. Qayta kiriting."); }
    if (r.status === 429) throw new Error("Groq so'rov limiti vaqtincha tugadi. Birozdan keyin urinib ko'ring.");
    if (!r.ok) throw new Error("Agent javob bera olmadi");
    const d = await r.json();
    used += d.usage?.total_tokens || 0;
    store.set("usage:" + agent.id, used);
    return d.choices?.[0]?.message?.content || "";
  }

  async function send(){
    const text = input.value.trim();
    if (!text || busy || used >= limit) return;
    msgs.push({role:"user", content:text});
    addMsg("user", text);
    input.value = "";
    error.textContent = "";
    busy = true; drawUsage();
    const wait = el("div", {class:"msg assistant"}, "Agent ishlayapti...");
    chat.append(wait);
    try {
      const reply = await ask(msgs.slice(-20));
      msgs.push({role:"assistant", content:reply});
      wait.remove(); addMsg("assistant", reply);
    } catch (e) {
      wait.remove(); error.textContent = e.message || "Xatolik yuz berdi";
    }
    busy = false; drawUsage();
  }
  sendBtn.addEventListener("click", send);

  $app.replaceChildren(
    el("div", {class:"top"}, el("a", {class:"brand", href:"#/"}, "Agentlar"), el("span", {class:"who"}, p.name)),
    el("h1", {}, agent.name),
    el("p", {class:"lead"}, agent.description),
    el("div", {class:"usage"}, usageText, el("div", {class:"bar"}, bar)),
    keyBox, isTg ? tgBox : null, isVoice ? voiceBox : null, chat, error,
    el("div", {class:"composer"}, input, sendBtn));
  drawKeyBox(); drawUsage();
  // Agent suhbatni o'zi boshlaydi: salomlashadi va vazifa uchun yetishmayotgan ma'lumotni so'raydi
  const START = "Suhbatni boshla: mening ismim bilan salomlash va o'zingni bir jumlada tanishtir. Yetishmayotgan ma'lumotlardan birinchisini so'ra. Agar hammasi bor bo'lsa, vazifani yozishni so'ra. Tayyor natija yozma.";
  async function begin(){
    if (used >= limit) return;
    msgs.push({role:"user", content:START});
    busy = true; drawUsage();
    const wait = el("div", {class:"msg assistant"}, "Agent ishlayapti...");
    chat.append(wait);
    try {
      const reply = await ask(msgs.slice(-20));
      msgs.push({role:"assistant", content:reply});
      wait.remove(); addMsg("assistant", reply, true);
    } catch (e) {
      wait.remove(); msgs.pop(); error.textContent = e.message || "Xatolik yuz berdi";
    }
    busy = false; drawUsage();
  }
  if (FB_ON) fbCall("/usage", {agentId:agent.id})
    .then(({d}) => { if (d.limit){ used = d.used; limit = d.limit; drawUsage(); } })
    .catch(() => {})
    .then(begin);
}

/* ============================ YO'NALTIRISH ============================ */
function route(){
  const p = profile();
  if (!p) return renderLogin();
  if (infoMissing()) return renderProfile(p, false);
  if (location.hash === "#/profile") return renderProfile(p, true);
  const m = location.hash.match(/^#\/agent\/([\w-]+)/);
  if (m){
    const a = catalog.find(x => x.id === m[1]);
    if (a) return renderAgent(p, a);
  }
  renderHome(p);
}
addEventListener("hashchange", route);
function fatal(e){
  const code = e?.code || "";
  const msg = (code === "auth/operation-not-allowed" || code === "auth/admin-restricted-operation")
    ? "Firebase > Authentication > Sign-in method bo'limida Anonymous kirishni yoqing."
    : code === "auth/configuration-not-found"
      ? "Firebase > Authentication bo'limida Get started tugmasini bosing."
      : (e?.message || "Noma'lum xato");
  $app.replaceChildren(el("h1", {}, "Ulanib bo'lmadi"), el("p", {class:"lead"}, msg));
}
if (FB_ON){
  $app.replaceChildren(el("p", {class:"lead"}, "Yuklanmoqda..."));
  onAuthStateChanged(fbAuth, async u => {
    if (!u){
      session = null; userInfo = null;
      try { await signInAnonymously(fbAuth); } catch (e) { fatal(e); }
      return;
    }
    session = {name:"Foydalanuvchi", user:u, tg:null};
    await Promise.all([loadCatalog(), loadUserInfo()]);
    if (userInfo?.name) session.name = userInfo.name;
    route();
  });
} else route();
</script>
